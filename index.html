<style>
  :root{
    /* ---- design tokens ---- */
    --bg:#F7F7F8; --card:#FFFFFF; --surface-2:#F3F3F5;
    --ink:#15161A; --muted:#6B7280; --muted-2:#9CA3AF; --line:#E7E7EA; --line-strong:#DADCE0;
    --purple:#4F46E5; --purple-dark:#3730A3; --purple-tint:#EEF2FF;
    --green:#15803D; --green-tint:#F0FDF4;
    --amber:#B45309; --amber-tint:#FFFBEB;
    --red:#DC2626; --red-tint:#FEF2F2;
    --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:20px;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  #root{max-width:480px;margin:0 auto;min-height:100vh;background:var(--card);display:flex;flex-direction:column;position:relative;}
  button,input,select{font-family:inherit;}
  button{cursor:pointer;border:none;background:none;color:inherit;transition:opacity .15s var(--ease), transform .15s var(--ease), background-color .15s var(--ease), border-color .15s var(--ease);}
  button:active{transform:scale(0.97);}
  .tabular{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
  .card{background:#fff;border-radius:var(--radius-lg);box-shadow:0 1px 2px rgba(16,24,40,0.03);border:1px solid var(--line);}
  .btn-primary{background:var(--purple);color:#fff;border-radius:var(--radius-md);font-weight:600;font-size:13px;padding:11px 16px;letter-spacing:-0.01em;}
  .btn-primary:hover{background:var(--purple-dark);}
  .btn-outline{border:1px solid var(--line-strong);background:#fff;border-radius:var(--radius-md);font-weight:600;font-size:13px;padding:11px 16px;color:var(--ink);}
  .btn-outline:hover{background:var(--surface-2);}
  .muted{color:var(--muted);}
  .dot{display:inline-block;border-radius:50%;flex-shrink:0;}
  .row{display:flex;align-items:center;}
  .between{display:flex;align-items:center;justify-content:space-between;}
  .progress-track{width:100%;background:var(--surface-2);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;border-radius:99px;transition:width .4s var(--ease);}
  .content{flex:1;overflow-y:auto;padding-bottom:90px;-webkit-overflow-scrolling:touch;}
  .hero{padding:24px 20px 28px;color:#fff;background:linear-gradient(165deg,#17151F 0%,#211D33 55%,#2B2645 100%);}
  .navbtn{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background-color .15s var(--ease);}
  .navbtn:hover{background:rgba(255,255,255,0.2);}
  .navbtn:disabled{opacity:.3;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .expense-row{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line);transition:background-color .15s var(--ease);}
  .expense-row:last-child{border-bottom:none;}
  .expense-row:hover{background:var(--surface-2);}
  .cat-icon{width:34px;height:34px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .iconbtn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:var(--radius-sm);}
  .iconbtn:hover{background:var(--surface-2);}
  input[type=text],input[type=number],input[type=date],input[type=password],input[type=tel],select{
    width:100%;background:#fff;border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:12px 14px;font-size:14px;outline:none;color:var(--ink);transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  input[type=text]:focus,input[type=number]:focus,input[type=date]:focus,input[type=password]:focus,input[type=tel]:focus,select:focus{border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-tint);}
  input[type=date]{text-align:left;direction:ltr;}
  input[type=date]::-webkit-datetime-edit{text-align:left;}
  input[type=date]::-webkit-calendar-picker-indicator{margin-left:auto;padding:8px;cursor:pointer;opacity:0.65;border-radius:8px;}
  input[type=date]::-webkit-calendar-picker-indicator:hover{opacity:1;background:var(--surface-2);}
  input[type=date]{min-height:44px;}
  .bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;padding:8px 8px calc(10px + env(safe-area-inset-bottom));z-index:40;}
  .navitem{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;font-size:9.5px;font-weight:600;transition:color .15s var(--ease);}
  .navitem svg{width:19px;height:19px;}
  .addbtn{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-26px;flex-shrink:0;
    background:linear-gradient(135deg,var(--purple),var(--purple-dark));box-shadow:0 8px 20px rgba(79,70,229,0.35);transition:transform .15s var(--ease), box-shadow .15s var(--ease);}
  .addbtn:hover{box-shadow:0 10px 24px rgba(79,70,229,0.45);}
  .overlay{position:fixed;inset:0;background:rgba(15,15,20,0.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s var(--ease);}
  .overlay.center{align-items:center;padding:20px;}
  .sheet{width:100%;max-width:480px;background:#fff;border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:slideUp .22s var(--ease);}
  .dialog{width:100%;max-width:320px;background:#fff;border-radius:var(--radius-lg);padding:22px;animation:popIn .18s var(--ease);}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes slideUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popIn{from{opacity:0;transform:scale(0.96);}to{opacity:1;transform:scale(1);}}
  .toggle-group{display:flex;background:var(--surface-2);border-radius:var(--radius-md);padding:4px;}
  .toggle-group button{flex:1;padding:8px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;color:var(--muted);}
  .toggle-group button.active{background:#fff;color:var(--purple);box-shadow:0 1px 2px rgba(16,24,40,0.06);}
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
  .chip-select{font-size:12px;border-radius:var(--radius-sm);background:#fff;border:1px solid var(--line-strong);padding:7px 10px;flex-shrink:0;color:var(--ink);}
  .filter-chip{font-size:12.5px;font-weight:600;border-radius:99px;padding:8px 14px;border:1px solid var(--line-strong);background:#fff;color:var(--ink);
    display:inline-flex;align-items:center;gap:5px;flex-shrink:0;white-space:nowrap;}
  .filter-chip.active{background:var(--purple-tint);border-color:var(--purple);color:var(--purple);}
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 20px;}
  .empty .icon-wrap{width:56px;height:56px;border-radius:var(--radius-lg);background:var(--purple-tint);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}

    animation:toastIn .2s var(--ease);}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}

<body>
<div id="root"></div>
<script>
/* ============================== helpers ============================== */
const PURPLE="#4F46E5",PURPLE_DARK="#3730A3",GREEN="#15803D",AMBER="#B45309",RED="#DC2626",INK="#15161A",MUTED="#6B7280";
const CATEGORIES=[
  {name:"Food",color:"#FF9F5A"},{name:"Groceries",color:"#17B992"},{name:"Transport",color:"#4F8EF7"},
  {name:"Shopping",color:"#F76FA0"},{name:"Bills",color:PURPLE},{name:"Rent",color:"#9B7EDE"},
  {name:"Entertainment",color:"#FFC24B"},{name:"Health",color:RED},{name:"Education",color:"#4AC0E0"},
  {name:"Family",color:"#B084F0"},{name:"Travel",color:"#5FD3A2"},{name:"Other",color:"#B7BDC9"}
];
const PAYMENT_METHODS=["Cash","UPI","Debit Card","Credit Card","Other"];
const WEEKDAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const LS_EXPENSES="bt_expenses_v1", LS_SETTINGS="bt_settings_v1";
const LS_SECURITY="bt_security_v1", LS_SECURE_DATA="bt_secure_v1";

/* ============================== crypto / PIN security ============================== */
// PIN is NEVER stored. Only a random salt + PBKDF2 iteration count are stored (both non-secret).
// The PIN derives an AES-GCM key each time; a wrong PIN simply fails to decrypt (GCM auth tag
// mismatch) — this doubles as PIN verification, so there is no separate "PIN hash" to steal.
let CRYPTO_KEY = null; // in-memory only for the unlocked session, never persisted
let persistTimer = null;

function randomBytes(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return a; }
function b64encode(bytes){ let s=""; for(let i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]); return btoa(s); }
function b64decode(str){ const bin=atob(str); const out=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }

async function deriveKey(pin, saltB64, iterations){
  const salt = b64decode(saltB64);
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(pin), {name:"PBKDF2"}, false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt, iterations, hash:"SHA-256"},
    keyMaterial, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]
  );
}
async function encryptJSON(key, obj){
  const iv = randomBytes(12);
  const enc = new TextEncoder();
  const data = enc.encode(JSON.stringify(obj));
  const cipherBuf = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, data);
  return { iv: b64encode(iv), ciphertext: b64encode(new Uint8Array(cipherBuf)) };
}
async function decryptJSON(key, blob){
  const iv = b64decode(blob.iv);
  const cipherBytes = b64decode(blob.ciphertext);
  const plainBuf = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, cipherBytes); // throws on wrong key
  const dec = new TextDecoder();
  return JSON.parse(dec.decode(plainBuf));
}

function loadSecurityMeta(){
  try{ const raw=localStorage.getItem(LS_SECURITY); return raw? JSON.parse(raw) : null; }catch(e){ return null; }
}
function saveSecurityMeta(meta){ try{ localStorage.setItem(LS_SECURITY, JSON.stringify(meta)); }catch(e){} }
function securityEnabled(){ const m=loadSecurityMeta(); return !!(m && m.enabled); }
function defaultSecurityMeta(){
  return { enabled:false, salt:null, iterations:150000, autoLockMinutes:5, failedAttempts:0, lockoutUntil:null, lockoutStrikes:0 };
}
function isLockedOut(meta){ return !!(meta && meta.lockoutUntil && meta.lockoutUntil > Date.now()); }

function schedulePersistEncrypted(){
  if(persistTimer) clearTimeout(persistTimer);
  persistTimer = setTimeout(() => { persistEncryptedNow().catch(()=>{}); }, 120);
}
async function persistEncryptedNow(){
  if(!CRYPTO_KEY) return;
  const blob = await encryptJSON(CRYPTO_KEY, { expenses: STATE.expenses, settings: STATE.settings });
  try{ localStorage.setItem(LS_SECURE_DATA, JSON.stringify(blob)); }catch(e){}
}
const now=new Date();

/* ---- Analytics: fires anonymous, no-payload events only. Never blocks the app if GA is unavailable. ---- */
function trackEvent(name){
  try { if (typeof gtag === "function") gtag("event", name); } catch(e) { /* ignore analytics failures */ }
}

/* ---- Snackbar/toast ---- */
let toastTimer = null;
function showToast(message){
  if (toastTimer) clearTimeout(toastTimer);
  STATE.toast = { message };
  render();
  toastTimer = setTimeout(() => { STATE.toast = null; render(); }, 2200);
}

const fmt=n=>"\u20B9"+Math.round(n||0).toLocaleString("en-IN");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2=n=>n<10?"0"+n:""+n;
const isoDate=(y,m,d)=>`${y}-${pad2(m+1)}-${pad2(d)}`;
const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
const monthLabel=(y,m)=>new Date(y,m,1).toLocaleString("en-US",{month:"long",year:"numeric"});
const monthShort=(y,m)=>new Date(y,m,1).toLocaleString("en-US",{month:"short"});
const dayOfWeekMon0=(y,m,d)=>(new Date(y,m,d).getDay()+6)%7;
const todayISO=()=>isoDate(now.getFullYear(),now.getMonth(),now.getDate());
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0;}return h;}
function catColor(name){const f=CATEGORIES.find(c=>c.name===name);if(f)return f.color;
  const p=["#8B5CF6","#EC4899","#F59E0B","#10B981","#3B82F6","#EF4444","#14B8A6","#A855F7"];
  return p[Math.abs(hashStr(name))%p.length];}
function mulberry32(seed){return function(){seed|=0;seed=(seed+0x6d2b79f5)|0;
  let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return((t^(t>>>14))>>>0)/4294967296;};}
function formatDateHeader(dateStr){const d=new Date(dateStr+"T00:00:00");const t=todayISO();
  const y=new Date();y.setDate(y.getDate()-1);const yISO=isoDate(y.getFullYear(),y.getMonth(),y.getDate());
  if(dateStr===t)return"Today";if(dateStr===yISO)return"Yesterday";
  return d.toLocaleDateString("en-US",{weekday:"short",day:"numeric",month:"short",year:"numeric"});}
function formatShortDate(dateStr){const d=new Date(dateStr+"T00:00:00");return d.toLocaleDateString("en-US",{day:"numeric",month:"short"});}
function greeting(){
  const h=new Date().getHours();
  const t = h<12 ? "Good morning" : h<17 ? "Good afternoon" : "Good evening";
  return `${t}! 👋`;
}
function monthDropdownOptions(){
  const list=[];
  for(let i=-12;i<=1;i++){
    const dt=new Date(now.getFullYear(), now.getMonth()+i, 1);
    list.push({y:dt.getFullYear(), m:dt.getMonth()});
  }
  if(!list.some(o=>o.y===STATE.year && o.m===STATE.month)) list.push({y:STATE.year, m:STATE.month});
  list.sort((a,b)=> (a.y*12+a.m) - (b.y*12+b.m));
  return list;
}
function monthDropdownHTML(light){
  const opts=monthDropdownOptions();
  const style = light
    ? "background:#fff;color:"+INK+";border:1px solid rgba(0,0,0,0.1)"
    : "background:rgba(255,255,255,0.18);color:#fff;border:none";
  return `<select onchange="App.setMonthDropdown(this.value)" style="width:auto;${style};font-size:12px;font-weight:600;padding:7px 26px 7px 10px;border-radius:10px;-webkit-appearance:none;appearance:none">
    ${opts.map(o=>`<option value="${o.y}-${o.m}" ${o.y===STATE.year&&o.m===STATE.month?"selected":""} style="color:#000">${monthLabel(o.y,o.m)}</option>`).join("")}
  </select>`;
}

function generateSampleExpenses(year,month){
  const rand=mulberry32(year*137+month*31+11);const dim=daysInMonth(year,month);
  const isCurrent=now.getFullYear()===year&&now.getMonth()===month;const lastDay=isCurrent?now.getDate():dim;
  const weights=[["Food",.24],["Groceries",.16],["Transport",.14],["Shopping",.12],["Bills",.1],["Entertainment",.08],["Health",.05],["Education",.04],["Family",.04],["Travel",.02],["Other",.01]];
  const desc={Food:["Lunch at office","Breakfast","Coffee","Dinner with friends","Snacks"],Groceries:["Weekly groceries","Vegetables","Big Basket order","Milk & bread"],
    Transport:["Petrol","Auto fare","Metro card recharge","Cab ride"],Shopping:["Shirt","Shoes","Online order","Gift"],
    Bills:["Electricity bill","Mobile recharge","Water bill","Gas cylinder"],Entertainment:["Movie tickets","Streaming","Concert"],
    Health:["Pharmacy","Doctor visit","Gym"],Education:["Online course","Books"],Family:["Kids' school fee","Family outing"],
    Travel:["Weekend trip","Train ticket"],Other:["Miscellaneous"]};
  const base={Food:150,Groceries:450,Transport:200,Shopping:600,Bills:900,Entertainment:350,Health:400,Education:800,Family:500,Travel:1200,Other:150};
  let out=[],id=1;
  for(let d=1;d<=lastDay;d++){const numTx=1+Math.floor(rand()*3);
    for(let i=0;i<numTx;i++){if(rand()<.22)continue;
      let r=rand(),acc=0,cat="Other";for(const[n,w]of weights){acc+=w;if(r<=acc){cat=n;break;}}
      const amount=Math.round(base[cat]*(0.5+rand())/10)*10;const opts=desc[cat]||["Expense"];
      const d2=opts[Math.floor(rand()*opts.length)];const pm=PAYMENT_METHODS[Math.floor(rand()*PAYMENT_METHODS.length)];
      out.push({id:`s${year}${month}-${id++}`,amount,category:cat,date:isoDate(year,month,d),paymentMethod:pm,description:d2,recurring:false});
    }}
  return out;
}
function defaultRecurring(year,month){
  return[{id:"r1",name:"Rent",amount:12000,category:"Rent",frequency:"Monthly"},{id:"r2",name:"Internet",amount:800,category:"Bills",frequency:"Monthly"},
    {id:"r3",name:"OTT Subscription",amount:499,category:"Entertainment",frequency:"Monthly"},{id:"r4",name:"Insurance",amount:2000,category:"Bills",frequency:"Monthly"}]
    .map(r=>({...r,startDate:isoDate(year,month,1)}));
}
function defaultSettings(year,month){
  return{monthlyBudget:30000,categoryBudgets:{Food:5000,Groceries:4000,Transport:3000,Shopping:4000,Bills:5000,Entertainment:2000,Other:7000},
    income:70000,incomeEnabled:true,autoAdjustFutureLimits:false,customCategories:[],recurring:defaultRecurring(year,month),
    appliedRecurringMonths:[`${year}-${month}`]};
}
function blankSettings(){
  return{monthlyBudget:0,categoryBudgets:{},income:0,incomeEnabled:false,autoAdjustFutureLimits:false,customCategories:[],recurring:[],
    appliedRecurringMonths:[`${now.getFullYear()}-${now.getMonth()}`]};
}
function budgetHealth(percentUsed,monthProgress,isCurrentMonth,hasBudget){
  if(!hasBudget)return{label:"Set a budget to see your status",color:MUTED};
  if(percentUsed>100)return{label:"Over budget",color:RED};
  if(isCurrentMonth&&percentUsed-monthProgress>15)return{label:"Watch your spending",color:AMBER};
  return{label:"You're on track",color:GREEN};
}
function progressColor(pct){if(pct>90)return RED;if(pct>70)return AMBER;return GREEN;}

/* icons (tiny inline svg) */
const ICONS={
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',

  plus:'<path d="M12 5v14M5 12h14"/>',

  moreHorizontal:'<circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/>',

  chevDown:'<path d="m6 9 6 6 6-6"/>',

};
function icon(name,size=16,color="currentColor",cls=""){
  return `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:${color}">${ICONS[name]||""}</svg>`;
}

/* ============================== state ============================== */
let STATE={
  expenses:[], settings:null,
  year:now.getFullYear(), month:now.getMonth(),
  view:"dashboard", modal:null, confirm:null, budgetShowAllCategories:false, openRowMenu:null, toast:null, showSafeInfo:false,
  calendarDay:null, trendMode:"daily",
  historyFilters:{search:"",category:"All",payment:"All",sort:"newest",groupBy:"date"},
  locked:false, booted:false, pinFlow:null, pinDraft:"", pinError:"", lockoutTick:0, openFilterSheet:null
};

function load(){
  try{
    const e=localStorage.getItem(LS_EXPENSES), s=localStorage.getItem(LS_SETTINGS);
    // First-time visitor (nothing in this browser's localStorage yet): start completely empty.
    // Only a returning user (who already has data saved under these keys) sees their own data.
    STATE.expenses = e? JSON.parse(e) : [];
    STATE.settings = s? JSON.parse(s) : blankSettings();
    if(!e) localStorage.setItem(LS_EXPENSES, JSON.stringify(STATE.expenses));
    if(!s) localStorage.setItem(LS_SETTINGS, JSON.stringify(STATE.settings));
  }catch(err){
    // localStorage unavailable/blocked — still start empty rather than showing anyone else's data.
    STATE.expenses=[];
    STATE.settings=blankSettings();
  }
}
function saveExpenses(){
  if(securityEnabled() && CRYPTO_KEY){ schedulePersistEncrypted(); return; }
  try{localStorage.setItem(LS_EXPENSES,JSON.stringify(STATE.expenses));}catch(e){}
}
function saveSettings(){
  if(securityEnabled() && CRYPTO_KEY){ schedulePersistEncrypted(); return; }
  try{localStorage.setItem(LS_SETTINGS,JSON.stringify(STATE.settings));}catch(e){}
}

function applyRecurringIfNeeded(){
  if(STATE.locked || !STATE.settings) return;
  const key=`${STATE.year}-${STATE.month}`;
  if(STATE.settings.appliedRecurringMonths.includes(key)) return;
  const items=STATE.settings.recurring.filter(r=>r.frequency==="Monthly");
  items.forEach(r=>{
    STATE.expenses.push({id:`rec-${r.id}-${key}`,amount:r.amount,category:r.category,date:isoDate(STATE.year,STATE.month,1),paymentMethod:"Other",description:r.name,recurring:true});
  });
  STATE.settings.appliedRecurringMonths.push(key);
  saveExpenses(); saveSettings();
}

/* ============================== derived data ============================== */
function deriveMonth(){
  const {year,month,expenses,settings}=STATE;
  const isCurrentMonth=year===now.getFullYear()&&month===now.getMonth();
  const dim=daysInMonth(year,month);
  const dayOfMonth=isCurrentMonth?now.getDate():dim;
  const daysRemaining=isCurrentMonth?Math.max(1,dim-dayOfMonth+1):0;
  const monthProgressPct=(dayOfMonth/dim)*100;
  const monthExpenses=expenses.filter(e=>{const d=new Date(e.date+"T00:00:00");return d.getFullYear()===year&&d.getMonth()===month;});
  const totalSpent=monthExpenses.reduce((s,e)=>s+e.amount,0);
  const monthlyBudget=settings.monthlyBudget||0;
  const hasBudget=monthlyBudget>0;
  const remaining=monthlyBudget-totalSpent;
  const percentUsed=hasBudget?(totalSpent/monthlyBudget)*100:0;
  const avgDailySpend=totalSpent/Math.max(1,dayOfMonth);
  const safeDailyLimit=isCurrentMonth&&hasBudget?Math.max(remaining,0)/daysRemaining:0;
  const todayExpenses=isCurrentMonth?monthExpenses.filter(e=>e.date===todayISO()):[];
  const todayTotal=todayExpenses.reduce((s,e)=>s+e.amount,0);
  const yd=new Date(now); yd.setDate(now.getDate()-1);
  const yISO=isoDate(yd.getFullYear(),yd.getMonth(),yd.getDate());
  const yesterdayTotal=isCurrentMonth?monthExpenses.filter(e=>e.date===yISO).reduce((s,e)=>s+e.amount,0):0;
  const catMap={}; monthExpenses.forEach(e=>{catMap[e.category]=(catMap[e.category]||0)+e.amount;});
  const categoryTotals=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const dailyTotals=new Array(dim).fill(0);
  monthExpenses.forEach(e=>{const d=new Date(e.date+"T00:00:00").getDate();dailyTotals[d-1]+=e.amount;});
  let highestDay=null,hv=-1; dailyTotals.forEach((v,i)=>{if(v>hv){hv=v;highestDay={day:i+1,amount:v};}});
  const pm=new Date(year,month-1,1); const prevYear=pm.getFullYear(), prevMonth=pm.getMonth();
  const prevMonthExpenses=expenses.filter(e=>{const d=new Date(e.date+"T00:00:00");return d.getFullYear()===prevYear&&d.getMonth()===prevMonth;});
  const prevTotalSpent=prevMonthExpenses.reduce((s,e)=>s+e.amount,0);
  const prevCatMap={}; prevMonthExpenses.forEach(e=>{prevCatMap[e.category]=(prevCatMap[e.category]||0)+e.amount;});
  const vsLastMonth=prevTotalSpent-totalSpent;
  const health=budgetHealth(percentUsed,monthProgressPct,isCurrentMonth,hasBudget);
  const allCategoryNames=[...CATEGORIES.map(c=>c.name), ...(settings.customCategories||[])];
  const nextIsFuture=new Date(year,month+1,1) > new Date(now.getFullYear(),now.getMonth(),1);
  return{isCurrentMonth,dim,dayOfMonth,daysRemaining,monthProgressPct,monthExpenses,totalSpent,monthlyBudget,hasBudget,remaining,
    percentUsed,avgDailySpend,safeDailyLimit,todayExpenses,todayTotal,yesterdayTotal,categoryTotals,dailyTotals,highestDay,
    prevYear,prevMonth,prevMonthExpenses,prevTotalSpent,prevCatMap,vsLastMonth,health,allCategoryNames,nextIsFuture};
}

/* ============================== render orchestration ============================== */
function update(fn){
  const active=document.activeElement; const activeId=active&&active.id;
  const selStart=active&&typeof active.selectionStart==="number"?active.selectionStart:null;
  const selEnd=active&&typeof active.selectionEnd==="number"?active.selectionEnd:null;
  if(fn) fn();
  applyRecurringIfNeeded();
  render();
  if(activeId){const el=document.getElementById(activeId);
    if(el){el.focus();if(selStart!==null&&el.setSelectionRange){try{el.setSelectionRange(selStart,selEnd);}catch(e){}}}}
}
function render(){
  if(STATE.locked){
    document.getElementById("root").innerHTML = lockScreenHTML();
    document.querySelectorAll("body > .overlay").forEach(el => el.remove());
    document.querySelectorAll("body > .toast").forEach(el => el.remove());
    focusOtpGroup("unlock"); // autofocus attribute is unreliable on innerHTML-injected content
    return;
  }
  const d=deriveMonth();
  const NAV=[["dashboard","Dashboard","home"],["expenses","Expenses","receipt"],["analytics","Analytics","pie"]];
  const MORE=[["calendar","Calendar","cal"],["budget","Budget","wallet"],["reports","Monthly Reports","bar"],["settings","Settings","gear"]];
  const titles={dashboard:"Dashboard",expenses:"Expenses",calendar:"Calendar",budget:"Budget",analytics:"Analytics",reports:"Monthly Reports",settings:"Settings",more:"More"};
  let body="";
  if(STATE.view==="dashboard") body=renderDashboard(d);
  else if(STATE.view==="expenses") body=renderHistory();
  else if(STATE.view==="calendar") body=renderCalendar(d);
  else if(STATE.view==="budget") body=renderBudget(d);
  else if(STATE.view==="analytics") body=renderAnalytics(d);
  else if(STATE.view==="reports") body=renderReports(d);
  else if(STATE.view==="settings") body=renderSettings();
  else if(STATE.view==="more") body=renderMore(MORE);

  // pages reached via the More list get a Back button; top-level tabs (dashboard/expenses/analytics) don't.
  const reachedViaMore = ["calendar","budget","reports","settings","more"].includes(STATE.view);
  const backTarget = STATE.view==="more" ? "dashboard" : "more";
  const topbar = STATE.view!=="dashboard" ? `
    <div class="top-title row" style="gap:10px">
      ${reachedViaMore? `<button class="iconbtn" style="margin-left:-4px" onclick="App.setView('${backTarget}')">${icon("chevL",18,INK)}</button>`:""}
      <span>${titles[STATE.view]}</span>
    </div>` : "";
  const moreActive = ["calendar","budget","reports","settings","more"].includes(STATE.view);

  let html = `
    ${topbar}
    <div class="content" id="scrollArea">${body}</div>
    <div class="bottomnav">
      ${NAV.slice(0,2).map(n=>navItemHTML(n,STATE.view===n[0])).join("")}
      <button class="addbtn" onclick="App.openAdd()">${icon("plus",22,"#fff")}</button>
      ${NAV.slice(2).map(n=>navItemHTML(n,STATE.view===n[0])).join("")}
      ${navItemHTML(["more","More","moreHorizontal"],moreActive)}
    </div>
  `;
  document.getElementById("root").innerHTML = html;

  // remove any previously-appended overlay(s) before adding the current one(s) —
  // without this, closing a drawer/modal left the old DOM node behind, blocking future clicks
  document.querySelectorAll("body > .overlay").forEach(el => el.remove());
  document.querySelectorAll("body > .toast").forEach(el => el.remove());

  if(STATE.modal){ document.body.insertAdjacentHTML("beforeend", expenseModalHTML(d)); }
  if(STATE.confirm){ document.body.insertAdjacentHTML("beforeend", confirmDialogHTML()); }
  if(STATE.toast){ document.body.insertAdjacentHTML("beforeend", toastHTML()); }
  if(STATE.pinFlow){
    document.body.insertAdjacentHTML("beforeend", pinFlowModalHTML());
    focusOtpGroup(STATE.pinFlow.step==="verify" ? "verify" : "new");
  }
  if(STATE.openFilterSheet){ document.body.insertAdjacentHTML("beforeend", filterSheetHTML()); }
}

  if(d.isCurrentMonth && (d.percentUsed-d.monthProgressPct)>15){

      subtitle:`${Math.round(d.percentUsed)}% of your monthly budget is already used.`,

      ${menuOpen ? `
        <div class="row-menu-backdrop" onclick="App.closeRowMenu()"></div>
        <div class="row-menu">
          <button onclick="App.editFromRowMenu('${e.id}')">${icon("pencil",14,INK)} Edit</button>
          <button class="danger" onclick="App.deleteFromRowMenu('${e.id}')">${icon("trash",14,RED)} Delete</button>
        </div>
      ` : ""}
    </div>
  </div>`;
}
function monthNavHTML(){
  const nextIsFuture=new Date(STATE.year,STATE.month+1,1) > new Date(now.getFullYear(),now.getMonth(),1);
  return `<div class="between">
    <button class="iconbtn" onclick="App.prevMonth()">${icon("chevL",16,INK)}</button>
    <div style="font-size:13px;font-weight:600">${monthLabel(STATE.year,STATE.month)}</div>
    <button class="iconbtn" onclick="App.nextMonth()" ${nextIsFuture?"disabled style='opacity:.3'":""}>${icon("chevR",16,INK)}</button>
  </div>`;
}

/* ============================== history ============================== */
function renderHistory(){
  const f=STATE.historyFilters;
  const allCats=[...CATEGORIES.map(c=>c.name), ...(STATE.settings.customCategories||[])];
  let list=STATE.expenses.filter(e=>{
    if(f.category!=="All"&&e.category!==f.category) return false;
    if(f.payment!=="All"&&e.paymentMethod!==f.payment) return false;
    if(f.search && !(`${e.description} ${e.category}`.toLowerCase().includes(f.search.toLowerCase()))) return false;
    return true;
  });
  list.sort((a,b)=>{
    if(f.sort==="newest") return b.date.localeCompare(a.date)||b.id.localeCompare(a.id);
    if(f.sort==="oldest") return a.date.localeCompare(b.date);
    if(f.sort==="highest") return b.amount-a.amount;
    if(f.sort==="lowest") return a.amount-b.amount;
    return 0;
  });
  const key = f.groupBy==="category" ? "category" : "date";
  const map={}, order=[];
  list.forEach(e=>{const k=e[key]; if(!map[k]){map[k]=[];order.push(k);} map[k].push(e);});
  let groups=order.map(k=>({key:k, items:map[k], total:map[k].reduce((s,e)=>s+e.amount,0)}));
  if(key==="category") groups.sort((a,b)=> f.sort==="lowest" ? a.total-b.total : b.total-a.total);
  else groups.sort((a,b)=> f.sort==="oldest" ? a.key.localeCompare(b.key) : b.key.localeCompare(a.key));

  const total=list.reduce((s,e)=>s+e.amount,0);

  return `
  <div style="padding:20px">
    <div style="position:relative">
      <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%)">${icon("search",14,MUTED)}</span>
      <input id="historySearch" type="text" value="${esc(f.search)}" placeholder="Search expenses" style="padding-left:34px"
        oninput="App.setHistoryFilter('search', this.value)">
    </div>
    <div class="toggle-group" style="margin-top:12px">
      <button class="${f.groupBy==='date'?'active':''}" onclick="App.setHistoryFilter('groupBy','date')">By Date</button>
      <button class="${f.groupBy==='category'?'active':''}" onclick="App.setHistoryFilter('groupBy','category')">By Category</button>
    </div>
    <div class="chip-row" style="margin-top:12px">
      <button class="filter-chip ${f.category!=='All'?'active':''}" onclick="App.openFilterSheet('category')">
        ${f.category==='All'?'Category':esc(f.category)} ${icon("chevDown",12,f.category!=='All'?PURPLE:MUTED)}
      </button>
      <button class="filter-chip ${f.payment!=='All'?'active':''}" onclick="App.openFilterSheet('payment')">
        ${f.payment==='All'?'Payment':esc(f.payment)} ${icon("chevDown",12,f.payment!=='All'?PURPLE:MUTED)}
      </button>
      <button class="filter-chip ${f.sort!=='newest'?'active':''}" onclick="App.openFilterSheet('sort')">
        ${({newest:'Sort',oldest:'Oldest first',highest:'Highest amount',lowest:'Lowest amount'})[f.sort]} ${icon("chevDown",12,f.sort!=='newest'?PURPLE:MUTED)}
      </button>
    </div>
    <div class="between" style="margin-top:16px;margin-bottom:8px">
      <div class="muted" style="font-size:12px">${list.length} expense${list.length!==1?"s":""} across all months</div>
      <div class="tabular" style="font-size:13px;font-weight:600">${fmt(total)}</div>
    </div>
    ${list.length===0?`
      <div class="card" style="padding:20px">
        <div class="empty" style="padding:0">
          <div class="icon-wrap">${icon("receipt",20,PURPLE)}</div>
          <div style="font-weight:600;font-size:14px">No expenses found</div>
          <div class="muted" style="font-size:12.5px;margin-top:3px">Try changing your filters, or add a new expense.</div>
          <button class="btn-primary" style="margin-top:12px" onclick="App.openAdd()">+ Add Expense</button>
        </div>
      </div>`:
      groups.map(g=>`
        <div style="margin-bottom:16px">
          <div class="between" style="margin-bottom:6px;padding:0 2px">
            <div style="font-size:12.5px;font-weight:600" class="row">${f.groupBy==='category'?`<span class="dot" style="width:8px;height:8px;background:${catColor(g.key)};margin-right:6px"></span>`:""}${esc(f.groupBy==='category'?g.key:formatDateHeader(g.key))}</div>
            <div class="tabular muted" style="font-size:12px">${fmt(g.total)}</div>
          </div>
          <div class="card">${g.items.map(e=>expenseRowHTML(e, f.groupBy==='category')).join("")}</div>
        </div>`).join("")}
  </div>`;
}

/* ============================== calendar ============================== */
function renderCalendar(d){
  const dim=d.dim, startOffset=dayOfWeekMon0(STATE.year,STATE.month,1);
  const cells=[...Array(startOffset).fill(null), ...Array.from({length:dim},(_,i)=>i+1)];
  const limit = d.safeDailyLimit || (d.hasBudget? d.monthlyBudget/dim : 0) || 1;
  function tier(amt){
    if(amt<=0) return {bg:"#F4F4F5",text:MUTED};
    const r=amt/limit;
    if(r>1.5) return {bg:"#FEF2F2",text:RED};
    if(r>1) return {bg:"#FFFBEB",text:"#B45309"};
    if(r>0.5) return {bg:"#EEF2FF",text:"#4F46E5"};
    return {bg:"#F0FDF4",text:"#15803D"};
  }
  const selExpenses = STATE.calendarDay ? d.monthExpenses.filter(e=>new Date(e.date+"T00:00:00").getDate()===STATE.calendarDay) : [];
  return `
  <div style="padding:20px">
    ${monthNavHTML()}
    <div class="cal-grid" style="margin-top:16px">
      ${WEEKDAYS.map(w=>`<div class="muted" style="font-size:10px;text-align:center;font-weight:600">${w}</div>`).join("")}
      ${cells.map((dd,i)=>{
        if(dd===null) return `<div></div>`;
        const amt=d.dailyTotals[dd-1]||0; const t=tier(amt); const selected=STATE.calendarDay===dd;
        return `<button class="cal-cell" style="background:${t.bg};outline:${selected?`2px solid ${PURPLE}`:"none"}" onclick="App.toggleCalendarDay(${dd})">
          <div style="font-weight:600;color:${INK}">${dd}</div><div class="tabular" style="font-size:8.5px;color:${t.text}">${amt>0?fmt(amt):"—"}</div>
        </button>`;
      }).join("")}
    </div>
    <div class="cal-legend">
      <span><span class="sw" style="background:#F0FDF4"></span>Low</span>
      <span><span class="sw" style="background:#EEF2FF"></span>Normal</span>
      <span><span class="sw" style="background:#FFFBEB"></span>High</span>
      <span><span class="sw" style="background:#FEF2F2"></span>Over limit</span>
    </div>
    ${STATE.calendarDay? `
    <div style="margin-top:16px">
      <div class="between" style="margin-bottom:8px">
        <div style="font-size:13px;font-weight:700">${monthShort(STATE.year,STATE.month)} ${STATE.calendarDay} — ${fmt(d.dailyTotals[STATE.calendarDay-1]||0)}</div>
        <button style="font-size:12px;font-weight:600;color:${PURPLE}" class="row" onclick="App.openAdd('${isoDate(STATE.year,STATE.month,STATE.calendarDay)}')">${icon("plus",13,PURPLE)}&nbsp;Add</button>
      </div>
      ${selExpenses.length===0? `<div class="muted" style="text-align:center;font-size:12px;padding:16px 0">No expenses on this day.</div>` :
        `<div class="card">${selExpenses.map(e=>expenseRowHTML(e,false)).join("")}</div>`}
    </div>`:""}
  </div>`;
}

/* ============================== budget ============================== */
function renderBudget(d){
  const s=STATE.settings; const allCats=d.allCategoryNames; const spentByCat=Object.fromEntries(d.categoryTotals);
  const totalAllocated = allCats.reduce((sum,c)=> sum + (s.categoryBudgets[c]||0), 0);
  const overAllocated = s.monthlyBudget>0 && totalAllocated > s.monthlyBudget;
  const catsWithData = allCats.filter(c => (s.categoryBudgets[c]||0)>0 || (spentByCat[c]||0)>0)
    .sort((a,b)=> (spentByCat[b]||0)-(spentByCat[a]||0));
  const catsWithoutData = allCats.filter(c => !catsWithData.includes(c));
  const showAll = STATE.budgetShowAllCategories;
  const catList = showAll ? [...catsWithData, ...catsWithoutData] : catsWithData;

  function categoryRow(cat){
    const spent=spentByCat[cat]||0, budget=s.categoryBudgets[cat]||0, pct=budget?(spent/budget)*100:0;
    const overBudget = budget>0 && spent>budget;
    return `<div>
      <div class="between" style="font-size:12px">
        <div class="row" style="font-weight:500"><span class="dot" style="width:8px;height:8px;background:${catColor(cat)};margin-right:6px"></span>${esc(cat)}</div>
        <div class="row" style="gap:6px">
          <span class="tabular muted">${fmt(spent)} / ${fmt(budget)}</span>
          ${overBudget?`<span style="font-size:9.5px;font-weight:700;color:${RED};background:#FEF2F2;padding:1px 6px;border-radius:99px">OVER</span>`:""}
        </div>
      </div>
      <div class="row" style="gap:8px;margin-top:6px">
        <div class="progress-track" style="height:7px;flex:1"><div class="progress-fill" style="width:${Math.min(100,pct)}%;background:${progressColor(pct)}"></div></div>
        <input type="number" placeholder="0" value="${s.categoryBudgets[cat]||""}" style="width:64px;font-size:11px;padding:6px 8px"
          data-cat="${esc(cat)}" onblur="App.saveCategoryBudget(this.dataset.cat, this.value)">
      </div>
    </div>`;
  }

  return `
  <div style="padding:20px;display:flex;flex-direction:column;gap:20px">

    <div>
      <div class="section-title">Overview</div>
      <div class="card" style="padding:16px">
        <div class="muted" style="font-size:12px;font-weight:600">Monthly Budget</div>
        <div class="row" style="gap:8px;margin-top:8px">
          <input id="budgetInput" type="number" value="${s.monthlyBudget||""}" style="flex:1" placeholder="e.g. 30000">
          <button class="btn-primary" onclick="App.saveBudget(document.getElementById('budgetInput').value)">Save</button>
        </div>
        ${s.monthlyBudget>0?`
        <div class="stat-grid" style="margin-top:14px;gap:10px">
          <div style="text-align:center;padding:8px;border-radius:10px;background:var(--bg)"><div class="muted" style="font-size:10px">Spent</div><div class="tabular" style="font-size:14px;font-weight:700;margin-top:2px">${fmt(d.totalSpent)}</div></div>
          <div style="text-align:center;padding:8px;border-radius:10px;background:var(--bg)"><div class="muted" style="font-size:10px">Remaining</div><div class="tabular" style="font-size:14px;font-weight:700;margin-top:2px">${fmt(Math.max(d.remaining,0))}</div></div>
        </div>`:`<div class="muted" style="font-size:11.5px;margin-top:10px">Set a monthly budget to unlock daily-spend guidance and category tracking.</div>`}
      </div>
    </div>

    <div>
      <div class="between" style="margin-bottom:8px">
        <div class="section-title" style="margin:0">Category Budgets</div>
        ${s.monthlyBudget>0?`<div class="tabular" style="font-size:11px;font-weight:600;color:${overAllocated?RED:MUTED}">${fmt(totalAllocated)} / ${fmt(s.monthlyBudget)} allocated</div>`:""}
      </div>
      ${overAllocated?`<div class="banner" style="background:#FEF2F2;color:${RED};margin-bottom:10px">${icon("alert",14,RED)}<span>Your category budgets add up to more than your monthly budget by ${fmt(totalAllocated-s.monthlyBudget)}.</span></div>`:""}
      ${catList.length===0?`
        <div class="card" style="padding:20px">
          <div class="muted" style="font-size:12px;text-align:center">No spending yet this month. Set a budget for a category below to start tracking it.</div>
        </div>
      `:`<div class="card" style="padding:12px;display:flex;flex-direction:column;gap:14px">${catList.map(categoryRow).join("")}</div>`}
      ${catsWithoutData.length>0?`
        <button style="width:100%;font-size:12px;font-weight:600;color:${PURPLE};padding:10px 0" onclick="App.toggleShowAllCategories()">
          ${showAll? "Show fewer categories" : `+ Add a budget for ${catsWithoutData.length} more categor${catsWithoutData.length===1?"y":"ies"}`}
        </button>`:""}
    </div>

    <div>
      <div class="section-title row">${icon("repeat",14)}&nbsp;Recurring Expenses</div>
      <div class="muted" style="font-size:11px;margin:-4px 0 8px">Automatically added to your expenses on the 1st of every month.</div>
      <div class="card" style="padding:12px">
        ${s.recurring.length===0?`<div class="muted" style="font-size:12px;text-align:center;padding:10px 0">No recurring expenses set up yet.</div>`:
        s.recurring.map(r=>`
          <div class="between" style="font-size:12px;padding:7px 0;border-bottom:1px solid var(--line)">

            <div class="row" style="gap:8px"><span class="tabular" style="font-weight:600">${fmt(r.amount)}</span>
              <button onclick="App.removeRecurring('${r.id}')">${icon("trash",13,RED)}</button></div>

        <div style="padding-top:10px;display:flex;flex-direction:column;gap:8px">
          <div class="row" style="gap:8px">

            <select id="recFrequency" style="width:110px"><option>Monthly</option><option>Weekly</option><option>Yearly</option></select>
            <button class="btn-primary" style="flex-shrink:0" onclick="App.addRecurring()">Add</button>
          </div>
        </div>
      </div>
    </div>

    <div>
      <div class="section-title">Monthly Income <span class="muted" style="font-weight:400">(optional)</span></div>
      <div class="card" style="padding:16px">
        <div class="between"><div class="muted" style="font-size:12px">Track income alongside your spending</div>
          <input type="checkbox" ${s.incomeEnabled?"checked":""} onchange="App.toggleIncome()"></div>
        ${s.incomeEnabled?`
          <div class="row" style="gap:8px;margin-top:10px">
            <input id="incomeInput" type="number" value="${s.income||""}" style="flex:1" placeholder="e.g. 70000">
            <button class="btn-primary" onclick="App.saveIncome(document.getElementById('incomeInput').value)">Save</button>
          </div>
          <div class="muted" style="font-size:11.5px;margin-top:8px">Remaining after expenses: <b class="tabular" style="color:${INK}">${fmt(s.income-d.totalSpent)}</b></div>
        `:""}
      </div>
    </div>

    <div>
      <div class="section-title">Preferences</div>
      <div class="card" style="padding:16px;display:flex;gap:10px;align-items:flex-start">
        <input type="checkbox" ${s.autoAdjustFutureLimits?"checked":""} onchange="App.toggleAutoAdjust()" style="margin-top:2px">
        <div><div style="font-size:12.5px;font-weight:600">Adjust future daily limits automatically</div>
        <div class="muted" style="font-size:11.5px;margin-top:2px">Your safe daily limit already spreads remaining budget across remaining days. Turning this on shows an explicit note whenever a day's overspend reshapes tomorrow's limit.</div></div>
      </div>
    </div>
  </div>`;
}

/* ============================== analytics ============================== */
function renderAnalytics(d){
  const cats=d.categoryTotals; const total=d.totalSpent;
  let gradientStops="", acc=0;
  cats.forEach(([name,amt])=>{const pct=total?amt/total*100:0; const start=acc; acc+=pct; gradientStops+=`${catColor(name)} ${start}% ${acc}%,`;});
  gradientStops = gradientStops.slice(0,-1) || "#eee 0% 100%";
  let trend=[];
  if(STATE.trendMode==="daily") trend=d.dailyTotals.map((v,i)=>({label:`${i+1}`,value:v}));
  else if(STATE.trendMode==="weekly"){ for(let i=0;i<d.dim;i+=7) trend.push({label:`W${Math.floor(i/7)+1}`,value:d.dailyTotals.slice(i,i+7).reduce((s,v)=>s+v,0)}); }
  else { for(let i=5;i>=0;i--){ const dt=new Date(STATE.year,STATE.month-i,1);
      const t=STATE.expenses.filter(e=>{const ed=new Date(e.date+"T00:00:00");return ed.getFullYear()===dt.getFullYear()&&ed.getMonth()===dt.getMonth();}).reduce((s,e)=>s+e.amount,0);
      trend.push({label:monthShort(dt.getFullYear(),dt.getMonth()),value:t}); } }
  const maxTrend=Math.max(1,...trend.map(t=>t.value));

  return `
  <div style="padding:20px">
    ${monthNavHTML()}
    <div style="margin-top:16px">
      <div class="section-title">Spending by Category</div>
      ${cats.length===0? `<div class="muted" style="text-align:center;font-size:12px;padding:30px 0">No expenses recorded this month yet.</div>` : `
      <div style="position:relative;height:190px;display:flex;align-items:center;justify-content:center">
        <div style="width:190px;height:190px;border-radius:50%;background:conic-gradient(${gradientStops})"></div>
        <div style="position:absolute;width:118px;height:118px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <div class="muted" style="font-size:11px">Total Expenses</div><div class="tabular" style="font-size:18px;font-weight:700">${fmt(total)}</div>
        </div>
      </div>
      <div class="card" style="padding:12px;margin-top:8px;display:flex;flex-direction:column;gap:12px">
        ${cats.map(([cat,amt])=>{
          const pct=total?amt/total*100:0;
          return `<div>
            <div class="between" style="font-size:12px">
              <div class="row" style="font-weight:500"><span class="dot" style="width:8px;height:8px;background:${catColor(cat)};margin-right:6px"></span>${esc(cat)}</div>
              <span class="tabular" style="font-weight:600">${fmt(amt)}</span>
            </div>
            <div class="muted" style="font-size:10.5px;margin-bottom:4px">${pct.toFixed(1)}% of total</div>
            <div class="progress-track" style="height:6px"><div class="progress-fill" style="width:${pct}%;background:${catColor(cat)}"></div></div>
          </div>`;
        }).join("")}
      </div>`}
    </div>
    <div style="margin-top:20px">
      <div class="between" style="margin-bottom:8px">
        <div class="section-title" style="margin:0">Spending Trend</div>
        <div class="toggle-group" style="width:auto">
          ${["daily","weekly","monthly"].map(m=>`<button class="${STATE.trendMode===m?'active':''}" style="padding:5px 10px;text-transform:capitalize" onclick="App.setTrendMode('${m}')">${m}</button>`).join("")}
        </div>
      </div>
      <div class="card" style="padding:12px 8px;height:150px;display:flex;align-items:flex-end;gap:${STATE.trendMode==='daily'?'2px':'6px'}">
        ${trend.map(t=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
          <div style="width:100%;max-width:22px;border-radius:4px 4px 0 0;background:${PURPLE};height:${Math.max(2,t.value/maxTrend*100)}%"></div>
        </div>`).join("")}
      </div>
    </div>
  </div>`;
}

        <table class="cmp">
          <thead><tr><th>Metric</th><th style="text-align:right">${monthShort(d.prevYear,d.prevMonth)}</th><th style="text-align:right">${monthShort(STATE.year,STATE.month)}</th></tr></thead>
          <tbody>

            <tr><td>Avg/day</td><td class="tabular" style="text-align:right">${fmt(prevAvg)}</td><td class="tabular" style="text-align:right">${fmt(curAvg)}</td></tr>

  confirmNewCategory(){
    App.syncModalDraftFromDOM();
    const name=(document.getElementById("modalNewCategory").value||"").trim();
    if(!name){ STATE.modal.error="Please enter a category name."; render(); return; }
    if(!STATE.settings.customCategories.includes(name) && !CATEGORIES.some(c=>c.name===name)){
      STATE.settings.customCategories.push(name); saveSettings();

  saveExpenseFromModal(){
    App.syncModalDraftFromDOM();
    const amount=parseFloat(document.getElementById("modalAmount").value);
    const category=STATE.modal.category;
    const paymentMethod=STATE.modal.paymentMethod;
    const date=document.getElementById("modalDate").value;
    const description=document.getElementById("modalDescription").value;
    const missing=[];
    if(!amount || amount<=0) missing.push("a valid amount");
    if(!category || category==="__new__") missing.push("a category");
    if(!paymentMethod) missing.push("a payment method");
    if(!date) missing.push("a date");

      STATE.modal.error="Please select "+missing.join(", ")+".";
      render();

    if(m.id){

      STATE.expenses[idx]={...STATE.expenses[idx], amount, category, date, paymentMethod:m.paymentMethod, description};
      trackEvent("expense_edited");
    } else {
      STATE.expenses.push({id:"e"+Date.now(), amount, category, date, paymentMethod:m.paymentMethod, description, recurring:false});

  exportData(){

    const a=document.createElement("a"); a.href=url; a.download=`budget-tracker-export-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  },
  exportMonthlyReport(){
    const d=deriveMonth();
    const csvEscape=(v)=>{ const s=String(v==null?"":v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
    const rows=[["Date","Description","Category","Payment Method","Amount"]];
    const sorted=[...d.monthExpenses].sort((a,b)=>a.date.localeCompare(b.date));
    sorted.forEach(e=>rows.push([e.date, e.description||e.category, e.category, e.paymentMethod, e.amount]));
    rows.push([]);
    rows.push(["Summary",""]);
    rows.push(["Monthly Budget", d.monthlyBudget]);
    rows.push(["Total Spent", d.totalSpent]);
    rows.push(["Remaining", Math.max(d.remaining,0)]);
    rows.push(["Percent Used", d.percentUsed.toFixed(1)+"%"]);
    rows.push(["Average Daily Spend", Math.round(d.avgDailySpend)]);
    rows.push(["Highest Spending Day", d.highestDay? `Day ${d.highestDay.day} (${fmt(d.highestDay.amount)})` : "—"]);
    rows.push(["Top Category", d.categoryTotals[0]? `${d.categoryTotals[0][0]} (${fmt(d.categoryTotals[0][1])})` : "—"]);
    rows.push([]);
    rows.push(["Category Breakdown",""]);
    d.categoryTotals.forEach(([cat,amt])=>rows.push([cat, amt]));
    const csv=rows.map(r=>r.map(csvEscape).join(",")).join("\n");
    const blob=new Blob([csv], {type:"text/csv"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`expense-report-${STATE.year}-${pad2(STATE.month+1)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  },

  cancelConfirm(e){ if(e && e.target!==e.currentTarget) return; STATE.confirm=null; render(); },
  confirmYes(){ const c=STATE.confirm; STATE.confirm=null; if(c && c.action) c.action(); update(); },

  /* ---- Security: OTP-box input handling (shared by unlock, verify, create/confirm) ---- */
  onOtpInput(el){
    el.value = el.value.replace(/\D/g,"").slice(0,1);
    const group = el.dataset.group;
    const idx = Number(el.dataset.idx);
    if(el.value && idx<3){
      const next = document.querySelector(`.otp-box[data-group="${group}"][data-idx="${idx+1}"]`);
      if(next) next.focus();
    }
    App.onOtpGroupChanged(group);
  },
  onOtpKeydown(e, el){
    if(e.key==="Backspace" && !el.value){
      const group = el.dataset.group;
      const idx = Number(el.dataset.idx);
      if(idx>0){
        const prev = document.querySelector(`.otp-box[data-group="${group}"][data-idx="${idx-1}"]`);
        if(prev) prev.focus();
      }
    }
  },
  onOtpGroupChanged(group){
    const value = readOtpGroup(group);
    if(value.length<4) return;
    if(group==="unlock"){ App.attemptUnlock(value); return; }
    if(group==="verify"){ App.submitVerifyStep(value); return; }
    if(group==="new"){ focusOtpGroup("confirm"); return; }
    if(group==="confirm"){ App.submitCombinedPin(); return; }
  },

  /* ---- Security: unlock ---- */
  async attemptUnlock(pin){
    const meta = loadSecurityMeta();
    if(!meta || !meta.enabled){ STATE.locked=false; render(); return; }
    if(isLockedOut(meta)){ render(); return; }
    try{
      const key = await deriveKey(pin, meta.salt, meta.iterations);
      const raw = localStorage.getItem(LS_SECURE_DATA);
      if(!raw) throw new Error("no secure data");
      const blob = JSON.parse(raw);
      const data = await decryptJSON(key, blob);
      STATE.expenses = data.expenses || [];
      STATE.settings = data.settings || blankSettings();
      CRYPTO_KEY = key;
      STATE.locked = false;
      STATE.pinError = "";
      meta.failedAttempts = 0; meta.lockoutUntil = null; meta.lockoutStrikes = 0;
      saveSecurityMeta(meta);
      applyRecurringIfNeeded();
      resetActivityTracking();
      render();
      trackEvent("app_opened");
    }catch(err){
      meta.failedAttempts = (meta.failedAttempts||0) + 1;
      if(meta.failedAttempts >= 5){
        meta.lockoutStrikes = (meta.lockoutStrikes||0) + 1;
        const seconds = Math.min(30 * Math.pow(2, meta.lockoutStrikes-1), 300);
        meta.lockoutUntil = Date.now() + seconds*1000;
        meta.failedAttempts = 0;
      }
      saveSecurityMeta(meta);
      STATE.pinError = "Incorrect PIN. Please try again.";
      render();
      startLockoutTickerIfNeeded();
    }
  },
  lockNow(){
    if(!securityEnabled()) return;
    if(persistTimer){ clearTimeout(persistTimer); persistEncryptedNow().catch(()=>{}); }
    STATE.locked = true;
    STATE.expenses = [];
    STATE.settings = null;
    STATE.modal=null; STATE.confirm=null; STATE.openRowMenu=null; STATE.pinFlow=null;
    CRYPTO_KEY = null;
    STATE.pinError = "";
    render();
  },

  /* ---- Security: create / change / disable PIN ---- */
  startCreatePin(){ STATE.pinFlow={mode:"create",step:"enter",error:""}; render(); },
  startChangePin(){ STATE.pinFlow={mode:"change",step:"verify",error:""}; render(); },
  startDisableLock(){ STATE.pinFlow={mode:"disable",step:"verify",error:""}; render(); },
  cancelPinFlow(e){ if(e && e.target!==e.currentTarget) return; STATE.pinFlow=null; render(); },
  onAppLockToggle(checked){ if(checked){ App.startCreatePin(); } else { App.startDisableLock(); } },
  async submitVerifyStep(value){
    const f = STATE.pinFlow; if(!f) return;
    const meta = loadSecurityMeta();
    try{
      const key = await deriveKey(value, meta.salt, meta.iterations);
      const raw = localStorage.getItem(LS_SECURE_DATA);
      const blob = JSON.parse(raw);
      await decryptJSON(key, blob);
      if(f.mode==="disable"){ await App.finishDisableLock(); return; }
      f.step="enter"; f.error=""; render();
    }catch(err){
      f.error="Incorrect PIN. Please try again."; render();
    }
  },
  async submitCombinedPin(){
    const f = STATE.pinFlow; if(!f) return;
    const newPin = readOtpGroup("new");
    const confirmPin = readOtpGroup("confirm");
    if(newPin.length!==4 || confirmPin.length!==4) return;
    if(newPin!==confirmPin){
      f.error="PINs don't match. Try again."; render(); return;
    }
    if(f.mode==="create"){ await App.finishCreatePin(newPin); }
    else if(f.mode==="change"){ await App.finishChangePin(newPin); }
  },
  async finishCreatePin(pin){
    try{
      const salt = b64encode(randomBytes(16));
      const iterations = 150000;
      const key = await deriveKey(pin, salt, iterations);
      await persistEncryptedWithKey(key);
      CRYPTO_KEY = key;
      const meta = defaultSecurityMeta();
      meta.enabled = true; meta.salt = salt; meta.iterations = iterations;
      saveSecurityMeta(meta);
      try{ localStorage.removeItem(LS_EXPENSES); localStorage.removeItem(LS_SETTINGS); }catch(e){}
      STATE.pinFlow=null;
      resetActivityTracking();
      showToast("PIN created successfully.");
    }catch(err){
      STATE.pinFlow.error = "Couldn't set up PIN protection on this device. Nothing has changed.";
      render();
    }
  },
  async finishChangePin(newPin){
    try{
      const salt = b64encode(randomBytes(16));
      const iterations = 150000;
      const newKey = await deriveKey(newPin, salt, iterations);
      await persistEncryptedWithKey(newKey);
      CRYPTO_KEY = newKey;
      const meta = loadSecurityMeta() || defaultSecurityMeta();
      meta.enabled = true; meta.salt = salt; meta.iterations = iterations;
      meta.failedAttempts=0; meta.lockoutUntil=null; meta.lockoutStrikes=0;
      saveSecurityMeta(meta);
      STATE.pinFlow=null;
      showToast("PIN changed successfully.");
    }catch(err){
      STATE.pinFlow.error = "Couldn't change your PIN. Please try again.";
      render();
    }
  },
  async finishDisableLock(){
    try{
      localStorage.setItem(LS_EXPENSES, JSON.stringify(STATE.expenses));
      localStorage.setItem(LS_SETTINGS, JSON.stringify(STATE.settings));
      try{ localStorage.removeItem(LS_SECURE_DATA); }catch(e){}
      const meta = defaultSecurityMeta();
      saveSecurityMeta(meta);
      CRYPTO_KEY = null;
      if(autoLockInterval){ clearInterval(autoLockInterval); autoLockInterval=null; }
      STATE.pinFlow=null;
      showToast("App Lock turned off.");
    }catch(err){
      STATE.pinFlow.error = "Couldn't turn off App Lock. Please try again.";
      render();
    }
  },
  setAutoLock(minutes){
    const meta = loadSecurityMeta(); if(!meta) return;
    meta.autoLockMinutes = Number(minutes);
    saveSecurityMeta(meta);
    resetActivityTracking();
    render();
  }
};

async function persistEncryptedWithKey(key){
  const blob = await encryptJSON(key, { expenses: STATE.expenses, settings: STATE.settings });
  localStorage.setItem(LS_SECURE_DATA, JSON.stringify(blob));
}

/* ---- lockout countdown ticker ---- */
let lockoutInterval = null;
function startLockoutTickerIfNeeded(){
  const meta = loadSecurityMeta();
  if(!isLockedOut(meta) || lockoutInterval) return;
  lockoutInterval = setInterval(() => {
    const m = loadSecurityMeta();
    if(!isLockedOut(m)){ clearInterval(lockoutInterval); lockoutInterval=null; }
    if(STATE.locked) render();
  }, 1000);
}

/* ---- auto-lock / inactivity tracking ---- */
let lastActivity = Date.now();
let hiddenAt = null;
let autoLockInterval = null;
function markActivity(){ lastActivity = Date.now(); }
function resetActivityTracking(){
  lastActivity = Date.now();
  hiddenAt = null;
  if(autoLockInterval){ clearInterval(autoLockInterval); autoLockInterval=null; }
  const meta = loadSecurityMeta();
  if(meta && meta.enabled && meta.autoLockMinutes>0){
    autoLockInterval = setInterval(() => {
      if(STATE.locked) return;
      if(Date.now()-lastActivity >= meta.autoLockMinutes*60000){ App.lockNow(); }
    }, 10000);
  }
}
if(typeof document !== "undefined"){
  document.addEventListener("click", markActivity);
  document.addEventListener("keydown", markActivity);
  document.addEventListener("touchstart", markActivity);
  document.addEventListener("visibilitychange", () => {
    if(STATE.locked) return;
    const meta = loadSecurityMeta();
    if(!meta || !meta.enabled) return;
    if(document.hidden){
      hiddenAt = Date.now();
    } else if(hiddenAt){
      const elapsed = Date.now()-hiddenAt;
      hiddenAt = null;
      if(meta.autoLockMinutes===0 || elapsed >= meta.autoLockMinutes*60000){ App.lockNow(); }
      else { markActivity(); }
    }
  });
}


/* ============================== boot ============================== */
function boot(){
  const meta = loadSecurityMeta();
  if(meta && meta.enabled){
    STATE.locked = true;
    render();
    if(isLockedOut(meta)) startLockoutTickerIfNeeded();
  } else {
    load();
    applyRecurringIfNeeded();
    STATE.locked = false;
    render();
    trackEvent("app_opened");
    resetActivityTracking();
  }
}
boot();
</script>
